name: Auto-Generate Blog Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Article Title'
        required: true
        default: 'My New Blog Post'
      author:
        description: 'Author Name'
        required: true
        default: 'Kunde Electric'
      date:
        description: 'Publish Date (YYYY-MM-DD)'
        required: true
        default: '2026-05-07'

jobs:
  create-blog-post:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Blog Post
        env:
          TITLE: ${{ github.event.inputs.title }}
          AUTHOR: ${{ github.event.inputs.author }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          # Generate slug from title
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          
          # Create HTML file
          cat > "blog/${SLUG}.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${TITLE} | Kunde Electric Blog</title>
            <link rel="stylesheet" href="../css/style.css">
            <link rel="stylesheet" href="../css/mobile-optimized.css">
            <style>
              .article-container { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
              .article-header { margin-bottom: 40px; border-bottom: 2px solid #e0e0e0; padding-bottom: 20px; }
              .article-date { color: #999; font-size: 14px; margin-bottom: 12px; }
              .article-title { font-size: 36px; color: #1a3d6e; margin: 0; line-height: 1.3; }
              .article-content { font-size: 16px; line-height: 1.8; color: #333; }
              .article-content h2 { font-size: 24px; color: #1a3d6e; margin: 40px 0 20px 0; }
              .article-content p { margin: 20px 0; }
              .back-link { display: inline-block; color: #06c; text-decoration: none; margin-bottom: 30px; }
              .back-link:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <nav class="nav-bar">
              <div class="container">
                <ul class="nav-menu">
                  <li><a href="../index.html">HOME</a></li>
                  <li><a href="../about.html">ABOUT US</a></li>
                  <li><a href="../products.html">PRODUCT</a></li>
                  <li><a href="index.html">BLOG</a></li>
                  <li><a href="../faq.html">FAQ</a></li>
                  <li><a href="../contact.html">CONTACT US</a></li>
                </ul>
              </div>
            </nav>
            <main class="article-container">
              <a href="index.html" class="back-link">&larr; Back to Blog</a>
              <div class="article-header">
                <div class="article-date">${DATE} | By ${AUTHOR}</div>
                <h1 class="article-title">${TITLE}</h1>
              </div>
              <div class="article-content">
                <p>Write your article content here...</p>
                <h2>Section 1</h2>
                <p>Your content...</p>
              </div>
            </main>
            <footer class="footer">
              <div class="container">
                <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
              </div>
            </footer>
          </body>
          </html>
          HTMLEOF
          
          echo "Created: blog/${SLUG}.html"
          echo "::set-output name=slug::${SLUG}"
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/
          git commit -m "Add new blog post: ${{ github.event.inputs.title }}"
          git push
      
      - name: Output Instructions
        run: |
          echo "✅ Blog post created successfully!"
          echo ""
          echo "Next steps:"
          echo "1. Edit the file at: blog/${{ steps.create.outputs.slug }}.html"
          echo "2. Add your article content"
          echo "3. Update blog.html to include the new article link"
          echo "4. Commit and push your changes"
