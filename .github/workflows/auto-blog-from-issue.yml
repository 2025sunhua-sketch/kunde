name: Auto-Generate Blog Post from Issue

on:
  issues:
    types: [labeled]

jobs:
  generate-blog:
    if: contains(github.event.label.name, 'blog-post')
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install -g marked
          npm install js-yaml
      
      - name: Generate Blog Post
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          # 创建文章脚本
          cat > generate.js << 'EOF'
          const fs = require('fs');
          const { marked } = require('marked');
          
          const title = process.env.ISSUE_TITLE;
          const body = process.env.ISSUE_BODY;
          const number = process.env.ISSUE_NUMBER;
          const author = process.env.ISSUE_AUTHOR;
          const createdAt = process.env.CREATED_AT.split('T')[0];
          
          // 生成文件名
          const slug = title
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/(^-|-$)/g, '');
          
          // 生成 HTML
          const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>${title} | Kunde Electric Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile-optimized.css">
  
  <style>
    .article-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    
    .article-header {
      margin-bottom: 40px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 20px;
    }
    
    .article-date {
      color: #999;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .article-title {
      font-size: 36px;
      color: #1a3d6e;
      margin: 0;
      line-height: 1.3;
    }
    
    .article-content {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
    }
    
    .article-content h2 {
      font-size: 24px;
      color: #1a3d6e;
      margin: 40px 0 20px 0;
    }
    
    .article-content h3 {
      font-size: 20px;
      color: #1a3d6e;
      margin: 30px 0 15px 0;
    }
    
    .article-content p {
      margin: 20px 0;
    }
    
    .article-content ul, .article-content ol {
      margin: 20px 0;
      padding-left: 30px;
    }
    
    .article-content li {
      margin: 10px 0;
    }
    
    .back-link {
      display: inline-block;
      color: #06c;
      text-decoration: none;
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav-bar">
    <div class="container">
      <ul class="nav-menu">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../about.html">ABOUT US</a></li>
        <li><a href="../products.html">PRODUCT</a></li>
        <li><a href="index.html">BLOG</a></li>
        <li><a href="../faq.html">FAQ</a></li>
        <li><a href="../contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>

  <!-- Article Content -->
  <main class="article-container">
    <a href="index.html" class="back-link">&larr; Back to Blog</a>
    
    <div class="article-header">
      <div class="article-date">${createdAt} | By ${author}</div>
      <h1 class="article-title">${title}</h1>
    </div>
    
    <div class="article-content">
      ${marked.parse(body)}
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>`;
          
          // 保存文件
          const filename = `blog/${slug}.html`;
          fs.writeFileSync(filename, html);
          console.log(`Created: ${filename}`);
          
          // 输出变量供后续步骤使用
          console.log(`::set-output name=filename::${filename}`);
          console.log(`::set-output name=slug::${slug}`);
          EOF
          
          node generate.js
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/*.html
          git commit -m "Auto-generate blog post from Issue #${{ github.event.issue.number }}

          Title: ${{ github.event.issue.title }}
          Author: ${{ github.event.issue.user.login }}" || echo "No changes to commit"
          git push
      
      - name: Comment on Issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Blog post automatically generated and published!\n\nView it at: https://kdelec.com/blog/' + process.env.ISSUE_TITLE.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html'
            })
