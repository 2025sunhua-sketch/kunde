name: Auto-Generate Blog Post Every 3 Days

on:
  # 每 3 天执行一次（UTC 时间午夜）
  schedule:
    - cron: '0 0 */3 * *'
  
  # 支持手动触发
  workflow_dispatch:

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    
    outputs:
      new_post_slug: ${{ steps.generate.outputs.slug }}
      new_post_title: ${{ steps.generate.outputs.title }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install -g marked
      
      - name: Get Next Topic
        id: get_topic
        run: |
          # 读取 content_plan.txt，跳过注释和已使用的行
          grep -v '^#' content_plan.txt | grep -v '^$' > topics.txt
          
          # 获取已生成的文章列表
          ls blog/*.html | grep -v 'index.html' | grep -v 'article-template.html' | sed 's/blog\///' | sed 's/.html//' > generated.txt
          
          # 获取下一个未生成的主题
          while IFS= read -r topic; do
            slug=$(echo "$topic" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            if ! grep -q "$slug" generated.txt; then
              echo "TOPIC=$topic" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              echo "Found next topic: $topic"
              break
            fi
          done < topics.txt
          
          # 清理临时文件
          rm topics.txt generated.txt
      
      - name: Generate Blog Post
        id: generate
        env:
          TOPIC: ${{ steps.get_topic.outputs.TOPIC }}
          SLUG: ${{ steps.get_topic.outputs.SLUG }}
        run: |
          if [ -z "$TOPIC" ]; then
            echo "All topics have been generated!"
            exit 0
          fi
          
          # 生成 HTML
          cat > "blog/${SLUG}.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${TOPIC} | Kunde Electric Blog</title>
            <link rel="stylesheet" href="../css/style.css">
            <link rel="stylesheet" href="../css/mobile-optimized.css">
            <style>
              .article-container { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
              .article-header { margin-bottom: 40px; border-bottom: 2px solid #e0e0e0; padding-bottom: 20px; }
              .article-date { color: #999; font-size: 14px; margin-bottom: 12px; }
              .article-title { font-size: 36px; color: #1a3d6e; margin: 0; line-height: 1.3; }
              .article-content { font-size: 16px; line-height: 1.8; color: #333; }
              .article-content h2 { font-size: 24px; color: #1a3d6e; margin: 40px 0 20px 0; }
              .article-content h3 { font-size: 20px; color: #1a3d6e; margin: 30px 0 15px 0; }
              .article-content p { margin: 20px 0; }
              .article-content ul, .article-content ol { margin: 20px 0; padding-left: 30px; }
              .article-content li { margin: 10px 0; }
              .back-link { display: inline-block; color: #06c; text-decoration: none; margin-bottom: 30px; }
              .back-link:hover { text-decoration: underline; }
              .cta-box { background: #f8f9fa; padding: 30px; border-radius: 8px; margin-top: 40px; text-align: center; }
              .cta-box a { color: #06c; font-weight: 600; }
            </style>
          </head>
          <body>
            <nav class="nav-bar">
              <div class="container">
                <ul class="nav-menu">
                  <li><a href="../index.html">HOME</a></li>
                  <li><a href="../about.html">ABOUT US</a></li>
                  <li><a href="../products.html">PRODUCT</a></li>
                  <li><a href="index.html">BLOG</a></li>
                  <li><a href="../faq.html">FAQ</a></li>
                  <li><a href="../contact.html">CONTACT US</a></li>
                </ul>
              </div>
            </nav>
            <main class="article-container">
              <a href="index.html" class="back-link">&larr; Back to Blog</a>
              <div class="article-header">
                <div class="article-date">$(date +%Y-%m-%d) | By Kunde Electric Team</div>
                <h1 class="article-title">${TOPIC}</h1>
              </div>
              <div class="article-content">
                <h2>Introduction</h2>
                <p>[Content will be added here]</p>
                <h2>Key Points</h2>
                <ul>
                  <li>Point 1</li>
                  <li>Point 2</li>
                  <li>Point 3</li>
                </ul>
                <h2>Conclusion</h2>
                <p>[Summary]</p>
                <div class="cta-box">
                  <p><strong>Need help?</strong> Contact our technical team at <a href="mailto:kundelec@126.com">kundelec@126.com</a> or +86-13566954989</p>
                </div>
              </div>
            </main>
            <footer class="footer">
              <div class="container">
                <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
              </div>
            </footer>
          </body>
          </html>
          HTMLEOF
          
          echo "::set-output name=slug::${SLUG}"
          echo "::set-output name=title::${TOPIC}"
          echo "Created: blog/${SLUG}.html"
      
      - name: Update blog.html
        run: |
          SLUG=${{ steps.generate.outputs.slug }}
          TITLE=${{ steps.generate.outputs.title }}
          DATE=$(date +%Y-%m-%d)
          
          # 在 blog.html 中添加新文章链接（在第一个文章位置）
          if [ -n "$SLUG" ]; then
            # 创建新文章卡片
            NEW_CARD="<!-- Article New -->
          <a href=\"blog/${SLUG}.html\" class=\"blog-card\">
            <div class=\"blog-card-date\">${DATE}</div>
            <h2 class=\"blog-card-title\">${TITLE}</h2>
            <p class=\"blog-card-excerpt\">[Article excerpt will be added here]</p>
            <div class=\"blog-card-meta\">
              <span>By Kunde Electric</span>
              <span class=\"read-more\">Read More →</span>
            </div>
          </a>"
            
            # 插入到 blog-grid 开头
            sed -i "s|<!-- Article 1 -->|${NEW_CARD}\n\n      <!-- Article 1 -->|" blog.html
          fi
      
      - name: Update sitemap.xml
        run: |
          SLUG=${{ steps.generate.outputs.slug }}
          if [ -n "$SLUG" ]; then
            # 在 sitemap.xml 中添加新文章（在</urlset>前）
            NEW_URL="<url>
        <loc>https://kdelec.com/blog/${SLUG}.html</loc>
        <lastmod>$(date +%Y-%m-%d)</lastmod>
        <changefreq>monthly</changefreq>
        <priority>0.7</priority>
      </url>"
            sed -i "s|</urlset>|${NEW_URL}\n\n</urlset>|" sitemap.xml
          fi
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/*.html blog.html sitemap.xml
          git commit -m "Auto-generate blog post: ${{ steps.generate.outputs.title }}
          
          Generated by GitHub Actions every 3 days
          Topic: ${{ steps.generate.outputs.title }}" || echo "No changes to commit"
          git push
      
      - name: Create Issue Notification
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blog Post Generated: ${{ steps.generate.outputs.title }}`,
              body: `✅ A new blog post has been automatically generated!\n\n**Title:** ${{ steps.generate.outputs.title }}\n**Date:** $(date +%Y-%m-%d)\n**File:** blog/${{ steps.generate.outputs.slug }}.html\n\nPlease review and update the content as needed.`
            })
