name: Auto Generate Blog Post with AI

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:
  push:
    paths:
      - content_plan.txt

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Dependencies
        run: |
          npm install -g marked
      
      - name: Get Next Topic
        id: topic
        run: |
          while IFS= read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            slug=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            if [ ! -f "blog/${slug}.html" ]; then
              echo "TOPIC=$line" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              echo "Found next topic: $line"
              exit 0
            fi
          done < content_plan.txt
          echo "All topics generated!"
          exit 0
      
      - name: Generate Content with Gemini AI
        if: steps.topic.outputs.slug != ''
        id: ai_content
        run: |
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          
          # 调用 Gemini API 生成文章内容
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Write a professional 500+ word blog article about: '"$TOPIC"'. \n\nRequirements:\n- Write for electrical engineers and procurement managers\n- Include technical specifications and industry standards\n- Include practical tips and best practices\n- Use professional tone\n- Include headings and bullet points\n- End with a conclusion\n- Write in English\n- Format as HTML with <h2>, <h3>, <p>, <ul>, <li> tags\n- Do NOT include <html>, <head>, <body> tags\n- Only return the article content inside <div class=\"article-content\">"}]
              }]
            }')
          
          # 提取生成的内容
          CONTENT=$(echo "$RESPONSE" | grep -o '"text":"[^"]*"' | head -1 | sed 's/"text":"//;s/"$//' | sed 's/\\n/\n/g' | sed 's/\\"/"/g')
          
          if [ -z "$CONTENT" ]; then
            CONTENT="<p>Professional article content will be added here soon...</p><h2>Key Points</h2><ul><li>Technical specifications</li><li>Industry standards compliance</li><li>Best practices</li></ul>"
          fi
          
          echo "CONTENT<<EOFEOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOFEOF" >> $GITHUB_OUTPUT
          
          echo "AI content generated successfully"
      
      - name: Create Blog Post
        if: steps.topic.outputs.slug != ''
        run: |
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          SLUG="${{ steps.topic.outputs.SLUG }}"
          DATE=$(date +%Y-%m-%d)
          CONTENT="${{ steps.ai_content.outputs.CONTENT }}"
          
          echo "Creating blog post: $TOPIC"
          
          # 创建完整的 HTML 文件
          cat > "blog/${SLUG}.html" << HTMLEOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${TOPIC} | Kunde Electric Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile-optimized.css">
  <style>
    .article-container { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
    .article-header { margin-bottom: 40px; border-bottom: 2px solid #e0e0e0; padding-bottom: 20px; }
    .article-date { color: #999; font-size: 14px; margin-bottom: 12px; }
    .article-title { font-size: 36px; color: #1a3d6e; margin: 0; line-height: 1.3; }
    .article-content { font-size: 16px; line-height: 1.8; color: #333; }
    .article-content h2 { font-size: 24px; color: #1a3d6e; margin: 40px 0 20px 0; }
    .article-content h3 { font-size: 20px; color: #1a3d6e; margin: 30px 0 15px 0; }
    .article-content p { margin: 20px 0; }
    .article-content ul, .article-content ol { margin: 20px 0; padding-left: 30px; }
    .article-content li { margin: 10px 0; }
    .article-content table { width: 100%; border-collapse: collapse; margin: 30px 0; }
    .article-content th, .article-content td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
    .article-content th { background: #f8f9fa; font-weight: 600; color: #1a3d6e; }
    .back-link { display: inline-block; color: #06c; text-decoration: none; margin-bottom: 30px; }
    .back-link:hover { text-decoration: underline; }
    .cta-box { background: #f8f9fa; padding: 30px; border-radius: 8px; margin-top: 40px; text-align: center; }
    .cta-box a { color: #06c; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <ul class="nav-menu">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../about.html">ABOUT US</a></li>
        <li><a href="../products.html">PRODUCT</a></li>
        <li><a href="index.html">BLOG</a></li>
        <li><a href="../faq.html">FAQ</a></li>
        <li><a href="../contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>
  <main class="article-container">
    <a href="index.html" class="back-link">&larr; Back to Blog</a>
    <div class="article-header">
      <div class="article-date">${DATE} | By Kunde Electric Team</div>
      <h1 class="article-title">${TOPIC}</h1>
    </div>
    <div class="article-content">
${CONTENT}
      <div class="cta-box">
        <p><strong>Need technical support?</strong> Contact our engineering team at <a href="mailto:kundelec@126.com">kundelec@126.com</a> or +86-13566954989</p>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
HTMLEOF
          
          echo "✅ Created: blog/${SLUG}.html"
      
      - name: Update blog.html
        if: steps.topic.outputs.slug != ''
        run: |
          SLUG="${{ steps.topic.outputs.SLUG }}"
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          DATE=$(date +%Y-%m-%d)
          
          # 在 blog.html 中添加新文章链接
          sed -i "s|<!-- Article New -->|<!-- Article New -->\n      <a href=\"blog/${SLUG}.html\" class=\"blog-card\">\n        <div class=\"blog-card-date\">${DATE}</div>\n        <h2 class=\"blog-card-title\">${TOPIC}</h2>\n        <p class=\"blog-card-excerpt\">[AI-generated article]</p>\n        <div class=\"blog-card-meta\">\n          <span>By Kunde Electric Team</span>\n          <span class=\"read-more\">Read More →</span>\n        </div>\n      </a>|" blog.html
          
          echo "✅ Updated blog.html"
      
      - name: Update sitemap.xml
        if: steps.topic.outputs.slug != ''
        run: |
          SLUG="${{ steps.topic.outputs.SLUG }}"
          
          # 在 sitemap.xml 中添加新文章
          sed -i "s|</urlset>|  <url>\n    <loc>https://kdelec.com/blog/${SLUG}.html</loc>\n    <lastmod>$(date +%Y-%m-%d)</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n\n</urlset>|" sitemap.xml
          
          echo "✅ Updated sitemap.xml"
      
      - name: Commit and Push
        if: steps.topic.outputs.slug != ''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/*.html blog.html sitemap.xml
          git commit -m "🤖 Auto-generate blog post with AI: ${{ steps.topic.outputs.TOPIC }}
          
          Generated by GitHub Actions + Gemini AI
          Topic: ${{ steps.topic.outputs.TOPIC }}
          Slug: ${{ steps.topic.outputs.SLUG }}" || echo "No changes to commit"
          git push
        
        echo "✅ Pushed to GitHub!"
