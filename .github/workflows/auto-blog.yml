name: Auto Generate Blog Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get Next Topic
        id: topic
        run: |
          echo "📖 Reading content_plan.txt..."
          
          # Read first valid topic (skip comments and empty lines)
          while IFS= read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            
            # Generate slug
            slug=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            
            # Check if already exists
            if [ ! -f "blog/${slug}.html" ]; then
              echo "TOPIC=$line" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              echo "✅ Found topic: $line"
              echo "🔗 Slug: $slug"
              exit 0
            else
              echo "⏭️  Skipping (already exists): $slug"
            fi
          done < content_plan.txt
          
          echo "✅ All topics generated!"
          exit 0
      
      - name: Create Article with AI
        if: steps.topic.outputs.slug != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          SLUG="${{ steps.topic.outputs.SLUG }}"
          DATE=$(date +%Y-%m-%d)
          
          echo "🤖 Generating content for: $TOPIC"
          
          # Generate content with Gemini AI
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "🔑 Using Gemini API..."
            AI_CONTENT=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=$GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "contents": [{
                  "parts": [{
                    "text": "Write a professional 600+ word blog article about: '"$TOPIC"'. Requirements: Write for electrical engineers, include technical specs and industry standards (IEC, DIN), use professional tone, include h2 and h3 headings, use HTML tags (h2, h3, p, ul, li, table, tr, td), do NOT include html/head/body tags, write in English"
                  }]
                }]
              }' | grep -o '"text":"[^"]*"' | head -1 | sed 's/"text":"//;s/"$//' | sed 's/\\n/\n/g' | sed 's/\\"/"/g')
            
            if [ -z "$AI_CONTENT" ]; then
              echo "⚠️  AI content empty, using fallback"
              AI_CONTENT="<p>Professional article about $TOPIC will be added soon.</p><h2>Key Features</h2><ul><li>High quality materials</li><li>Industry standard compliance</li><li>Reliable performance</li></ul>"
            fi
          else
            echo "⚠️  No GEMINI_API_KEY, using placeholder"
            AI_CONTENT="<p>Article content will be generated with AI. Topic: $TOPIC</p><h2>Overview</h2><p>Professional content coming soon...</p>"
          fi
          
          # Create HTML file
          cat > "blog/${SLUG}.html" << HTMLEOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${TOPIC} | Kunde Electric Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile-optimized.css">
  <style>
    .article-container{max-width:800px;margin:0 auto;padding:60px 20px}
    .article-header{margin-bottom:40px;border-bottom:2px solid #e0e0e0;padding-bottom:20px}
    .article-date{color:#999;font-size:14px;margin-bottom:12px}
    .article-title{font-size:36px;color:#1a3d6e;margin:0;line-height:1.3}
    .article-content{font-size:16px;line-height:1.8;color:#333}
    .article-content h2{font-size:24px;color:#1a3d6e;margin:40px 0 20px 0}
    .article-content h3{font-size:20px;color:#1a3d6e;margin:30px 0 15px 0}
    .article-content p{margin:20px 0}
    .article-content ul,.article-content ol{margin:20px 0;padding-left:30px}
    .article-content li{margin:10px 0}
    .back-link{display:inline-block;color:#06c;text-decoration:none;margin-bottom:30px}
    .back-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <ul class="nav-menu">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../about.html">ABOUT US</a></li>
        <li><a href="../products.html">PRODUCT</a></li>
        <li><a href="index.html">BLOG</a></li>
        <li><a href="../faq.html">FAQ</a></li>
        <li><a href="../contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>
  <main class="article-container">
    <a href="index.html" class="back-link">&larr; Back to Blog</a>
    <div class="article-header">
      <div class="article-date">${DATE} | By Kunde Electric Team</div>
      <h1 class="article-title">${TOPIC}</h1>
    </div>
    <div class="article-content">
${AI_CONTENT}
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
HTMLEOF
          
          echo "✅ Created: blog/${SLUG}.html"
      
      - name: Update articles.json
        if: steps.topic.outputs.slug != ''
        run: |
          SLUG="${{ steps.topic.outputs.SLUG }}"
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          DATE=$(date +%Y-%m-%d)
          
          echo "📝 Updating articles.json..."
          
          # Create new entry
          NEW_ENTRY="{\"title\":\"${TOPIC}\",\"slug\":\"${SLUG}\",\"date\":\"${DATE}\",\"excerpt\":\"AI-generated article\"}"
          
          # Check if articles.json exists
          if [ -f "blog/articles.json" ]; then
            echo "📖 Found existing articles.json"
            # Remove closing bracket, add comma and new entry, add closing bracket
            sed -i 's/\]$//' blog/articles.json
            echo ",$NEW_ENTRY]" > blog/articles.json.tmp
            cat blog/articles.json blog/articles.json.tmp > blog/articles.json.new
            mv blog/articles.json.new blog/articles.json
            rm blog/articles.json.tmp
          else
            echo "📄 Creating new articles.json"
            echo "[$NEW_ENTRY]" > blog/articles.json
          fi
          
          echo "✅ Updated articles.json"
          cat blog/articles.json
      
      - name: Clean content_plan.txt
        if: steps.topic.outputs.slug != ''
        run: |
          echo "🧹 Cleaning content_plan.txt..."
          
          # Remove first line (the topic we just processed)
          # Keep comments and empty lines, remove the first non-comment non-empty line
          awk '
            BEGIN { removed = 0 }
            /^#/ { print; next }
            /^[[:space:]]*$/ { print; next }
            { if (removed == 0) { removed = 1; next } else { print } }
          ' content_plan.txt > content_plan.txt.tmp
          
          mv content_plan.txt.tmp content_plan.txt
          
          echo "✅ Removed processed topic from content_plan.txt"
          echo "📊 Remaining topics:"
          grep -v '^#' content_plan.txt | grep -v '^$' | wc -l
      
      - name: Commit and Push All Changes
        if: steps.topic.outputs.slug != ''
        run: |
          echo "🚀 Pushing all changes to GitHub..."
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add all changed files
          git add blog/*.html
          git add blog/articles.json
          git add content_plan.txt
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit"
            exit 0
          fi
          
          # Commit with detailed message
          git commit -m "🤖 Auto-generate blog post

Topic: ${{ steps.topic.outputs.TOPIC }}
Slug: ${{ steps.topic.outputs.SLUG }}

Changes:
- Created blog post HTML
- Updated articles.json
- Cleaned content_plan.txt

Generated by GitHub Actions + Gemini AI"
          
          # Push to remote
          git push
          
          echo "✅ Successfully pushed to GitHub!"
          echo "🎉 Blog post generated and published!"
