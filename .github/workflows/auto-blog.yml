name: Auto Generate Blog Post

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get Next Topic
        id: topic
        run: |
          # 读取 content_plan.txt，获取第一个未使用的主题
          while IFS= read -r line; do
            # 跳过注释和空行
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            
            # 生成 slug
            slug=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            
            # 检查是否已存在
            if [ ! -f "blog/${slug}.html" ]; then
              echo "TOPIC=$line" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              echo "Found: $line"
              exit 0
            fi
          done < content_plan.txt
          
          echo "All topics generated!"
          exit 0
      
      - name: Create Blog Post
        if: steps.topic.outputs.slug != ''
        run: |
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          SLUG="${{ steps.topic.outputs.SLUG }}"
          DATE=$(date +%Y-%m-%d)
          
          echo "Creating: $TOPIC"
          
          # 创建 HTML 文件
          cat > "blog/${SLUG}.html" << EOF
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${TOPIC} | Kunde Electric Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile-optimized.css">
  <style>
    .article-container { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
    .article-header { margin-bottom: 40px; border-bottom: 2px solid #e0e0e0; padding-bottom: 20px; }
    .article-date { color: #999; font-size: 14px; margin-bottom: 12px; }
    .article-title { font-size: 36px; color: #1a3d6e; margin: 0; line-height: 1.3; }
    .article-content { font-size: 16px; line-height: 1.8; color: #333; }
    .article-content h2 { font-size: 24px; color: #1a3d6e; margin: 40px 0 20px 0; }
    .article-content p { margin: 20px 0; }
    .back-link { display: inline-block; color: #06c; text-decoration: none; margin-bottom: 30px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <ul class="nav-menu">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../about.html">ABOUT US</a></li>
        <li><a href="../products.html">PRODUCT</a></li>
        <li><a href="index.html">BLOG</a></li>
        <li><a href="../faq.html">FAQ</a></li>
        <li><a href="../contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>
  <main class="article-container">
    <a href="index.html" class="back-link">&larr; Back to Blog</a>
    <div class="article-header">
      <div class="article-date">${DATE} | By Kunde Electric Team</div>
      <h1 class="article-title">${TOPIC}</h1>
    </div>
    <div class="article-content">
      <h2>Introduction</h2>
      <p>[Content will be added here]</p>
      <h2>Key Points</h2>
      <ul>
        <li>Point 1</li>
        <li>Point 2</li>
        <li>Point 3</li>
      </ul>
      <h2>Conclusion</h2>
      <p>[Summary]</p>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
EOF
          
          echo "Created: blog/${SLUG}.html"
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/*.html
          git commit -m "Auto-generate blog post: ${{ steps.topic.outputs.TOPIC }}" || echo "No changes"
          git push
