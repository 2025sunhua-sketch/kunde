name: Auto Generate Blog Post

on:
  workflow_dispatch:
  push:
    paths:
      - 'content_plan.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Next Topic
        id: topic
        run: |
          while IFS= read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            slug=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            if [ ! -f "blog/${slug}.html" ]; then
              echo "TOPIC=$line" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              exit 0
            fi
          done < content_plan.txt

      - name: Create Article with AI
        if: steps.topic.outputs.slug != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 这一步会生成文件到 blog 文件夹
          DATE=$(date +%Y-%m-%d)
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          SLUG="${{ steps.topic.outputs.SLUG }}"
          
          echo "<h1>$TOPIC</h1><p>Published on $DATE</p>" > "blog/${SLUG}.html"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 强制添加 blog 文件夹下的所有新文件
          git add blog/*.html
          # 提交修改，如果没变化就跳过
          git commit -m "🤖 自动生成博文：${{ steps.topic.outputs.TOPIC }}" || echo "没有新内容需要提交"
          # 推送到仓库
          git push
