name: Auto-Generate Blog Post

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate Blog Post
        run: |
          # 读取 content_plan.txt
          mapfile -t TOPICS < <(grep -v '^#' content_plan.txt | grep -v '^$')
          
          # 获取已生成的文章
          mapfile -t GENERATED < <(ls blog/*.html 2>/dev/null | grep -v 'index.html' | grep -v 'article-template.html' | xargs -n1 basename | sed 's/.html//')
          
          # 查找下一个未使用的主题
          NEXT_TOPIC=""
          NEXT_SLUG=""
          for topic in "${TOPICS[@]}"; do
            slug=$(echo "$topic" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            if [[ ! " ${GENERATED[@]} " =~ " ${slug} " ]]; then
              NEXT_TOPIC="$topic"
              NEXT_SLUG="$slug"
              break
            fi
          done
          
          if [ -z "$NEXT_TOPIC" ]; then
            echo "All topics generated!"
            exit 0
          fi
          
          echo "Generating: $NEXT_TOPIC"
          
          # 创建文章
          cat > "blog/${NEXT_SLUG}.html" << 'HTMLEOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITLE_PLACEHOLDER | Kunde Electric Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mobile-optimized.css">
  <style>
    .article-container{max-width:800px;margin:0 auto;padding:60px 20px}
    .article-header{margin-bottom:40px;border-bottom:2px solid #e0e0e0;padding-bottom:20px}
    .article-date{color:#999;font-size:14px;margin-bottom:12px}
    .article-title{font-size:36px;color:#1a3d6e;margin:0;line-height:1.3}
    .article-content{font-size:16px;line-height:1.8;color:#333}
    .article-content h2{font-size:24px;color:#1a3d6e;margin:40px 0 20px 0}
    .article-content p{margin:20px 0}
    .back-link{display:inline-block;color:#06c;text-decoration:none;margin-bottom:30px}
    .back-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <ul class="nav-menu">
        <li><a href="../index.html">HOME</a></li>
        <li><a href="../about.html">ABOUT US</a></li>
        <li><a href="../products.html">PRODUCT</a></li>
        <li><a href="index.html">BLOG</a></li>
        <li><a href="../faq.html">FAQ</a></li>
        <li><a href="../contact.html">CONTACT US</a></li>
      </ul>
    </div>
  </nav>
  <main class="article-container">
    <a href="index.html" class="back-link">&larr; Back to Blog</a>
    <div class="article-header">
      <div class="article-date">DATE_PLACEHOLDER | By Kunde Electric Team</div>
      <h1 class="article-title">TITLE_PLACEHOLDER</h1>
    </div>
    <div class="article-content">
      <p>Article content will be added here...</p>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 KUNDE ELECTRIC. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
HTMLEOF
          
          # 替换占位符
          sed -i "s|TITLE_PLACEHOLDER|${NEXT_TOPIC}|g" "blog/${NEXT_SLUG}.html"
          sed -i "s|DATE_PLACEHOLDER|$(date +%Y-%m-%d)|g" "blog/${NEXT_SLUG}.html"
          
          # 提交
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog/*.html
          git commit -m "Auto-generate blog: ${NEXT_TOPIC}" || echo "No changes"
          git push
