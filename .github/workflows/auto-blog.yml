name: Auto Generate Blog Post

on:
  workflow_dispatch:
  push:
    paths:
      - 'content_plan.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Next Topic
        id: topic
        run: |
          while IFS= read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            slug=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            if [ ! -f "blog/${slug}.html" ]; then
              echo "TOPIC=$line" >> $GITHUB_OUTPUT
              echo "SLUG=$slug" >> $GITHUB_OUTPUT
              exit 0
            fi
          done < content_plan.txt

      - name: Create Article with AI
        if: steps.topic.outputs.slug != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TOPIC="${{ steps.topic.outputs.TOPIC }}"
          SLUG="${{ steps.topic.outputs.SLUG }}"
          DATE=$(date +%Y-%m-%d)
          
          # 使用 API 生成内容并填充模板
          AI_CONTENT="<p>Professional technical analysis of $TOPIC for industrial power systems.</p>"
          
          cat > "blog/${SLUG}.html" << EOF
          $(cat blog/article-template.html | sed "s/{{TITLE}}/$TOPIC/g" | sed "s/{{DATE}}/$DATE/g")
          EOF