name: Auto Generate Blog Post

on:
  workflow_dispatch:
  push:
    paths:
      - 'content_plan.txt'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Inline Python Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, requests, json, re
          from datetime import datetime

          # 1. 获取标题
          plan_path = 'content_plan.txt'
          if not os.path.exists(plan_path): exit(0)
          with open(plan_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          topic = ''
          remaining = []
          for line in lines:
              if not topic and line.strip() and not line.startswith('#'):
                  topic = line.strip()
              else:
                  remaining.append(line)

          if not topic:
              print('No topic found'); exit(0)

          # 2. 调用 AI
          api_key = os.getenv('GEMINI_API_KEY')
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key={api_key}'
          prompt = f'Write a professional 800-word blog article about: {topic} for the power fittings industry. Use HTML tags like <h2>, <p>, <ul>. Write in English.'
          
          try:
              res = requests.post(url, json={'contents': [{'parts': [{'text': prompt}]}]})
              ai_text = res.json()['candidates'][0]['content']['parts'][0]['text']
              ai_content = ai_text.replace('\n', '<br>')
          except Exception as e:
              ai_content = f'<p>Generation failed: {str(e)}</p>'

          # 3. 生成文章
          slug = re.sub(r'[^a-z0-9]+', '-', topic.lower()).strip('-')
          filename = f'blog/{slug}.html'
          date_str = datetime.now().strftime('%Y-%m-%d')
          
          with open('blog/article-template.html', 'r', encoding='utf-8') as f:
              html = f.read()
          
          final_html = html.replace('{{TITLE}}', topic).replace('{{DATE}}', date_str).replace('{{CONTENT}}', ai_content)
          
          with open(filename, 'w', encoding='utf-8') as f:
              f.write(final_html)

          # 4. 精准更新 blog/index.html
          with open(plan_path, 'w', encoding='utf-8') as f:
              f.writelines(remaining)

          blog_idx = 'blog/index.html'
          if os.path.exists(blog_idx):
              with open(blog_idx, 'r', encoding='utf-8') as f:
                  idx_html = f.read()
              
              # 生成符合 blog 页面结构的链接 (注意：这里是在同一文件夹下，无需加 ../)
              new_entry = f'\n<div class=\"post-item\"><a href=\"{slug}.html\">{topic}</a> <span>({date_str})</span></div>\n'
              
              if '' in idx_html:
                  idx_html = idx_html.replace('', new_entry)
                  with open(blog_idx, 'w', encoding='utf-8') as f:
                      f.write(idx_html)
          "

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🤖 自动生成博文并更新目录" || echo "No changes"
          git push