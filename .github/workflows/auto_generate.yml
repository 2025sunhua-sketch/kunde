name: Auto Generate Blog Articles

on:
  # 定时触发：每周一上午 9 点 (UTC 时间)
  schedule:
    - cron: '0 9 * * 1'
  
  # 手动触发：在 GitHub Actions 页面点击 "Run workflow"
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (generate only 1 article)'
        required: false
        default: 'false'
  
  # 文件触发：当 content_plan.txt 更新时
  push:
    paths:
      - 'content_plan.txt'
      - 'blog/article-template.html'

# 权限声明：允许 Actions 写回仓库
permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai
      
      # 4. 配置 Git 用户（用于提交生成的文章）
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      # 5. 运行博客生成脚本
      - name: Generate Blog Articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          echo "🚀 Starting blog generation..."
          echo "📂 Working directory: $(pwd)"
          echo "🔑 API Key configured: $([ -n "$GEMINI_API_KEY" ] && echo 'Yes' || echo 'No')"
          
          # 如果是 test mode，只生成 1 篇文章
          if [ "$TEST_MODE" = "true" ]; then
            echo "🧪 Running in TEST MODE (1 article only)"
            head -n 1 content_plan.txt > content_plan_test.txt
            mv content_plan_test.txt content_plan.txt
          fi
          
          # 运行生成脚本
          python generate_blog.py
          
          echo "✅ Blog generation completed"
      
      # 6. 提交并推送生成的文章
      - name: Commit and push generated articles
        run: |
          echo "📦 Checking for changes..."
          
          # 检查是否有新文件
          if git status --porcelain | grep -q "^?? blog/.*\.html$"; then
            echo "✅ New articles found, committing changes..."
            
            # 添加新文件
            git add -A
            
            # 提交
            git commit -m "📝 Auto-generate blog articles [GitHub Actions]" \
              || echo "No changes to commit"
            
            # 推送到远程仓库
            git push origin HEAD:main \
              || echo "Push failed, but continuing..."
            
            echo "✅ Articles committed and pushed"
          else
            echo "ℹ️  No new articles generated"
          fi
      
      # 7. 输出总结
      - name: Summary
        run: |
          echo "## 📊 Blog Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la blog/*.html 2>/dev/null || echo "No HTML files found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Visit: https://kdelec.com/blog.html" >> $GITHUB_STEP_SUMMARY
          echo "- Check articles.json for index" >> $GITHUB_STEP_SUMMARY
          echo "- Review sitemap.xml for SEO" >> $GITHUB_STEP_SUMMARY
